name: Собрать index.json

on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "catalog.config.json"
      - "tools/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить и пересобрать index.json
        run: python tools/check_mods.py --write
      - name: Закоммитить, если изменился
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || (git commit -m "Обновить index.json" && git push)
